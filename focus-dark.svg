<svg xmlns="http://www.w3.org/2000/svg" width="880" height="227" viewBox="0 0 880 227" fill="none">
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.lbl{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.08em;fill:#8b949e}
.tick{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px;letter-spacing:.06em;fill:#8b949e}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.5}80%,100%{transform:scale(3.4);opacity:0}}
.spark{stroke-dasharray:16 984;animation:spark 7s cubic-bezier(.45,0,.55,1) infinite}
@keyframes spark{0%{stroke-dashoffset:16}100%{stroke-dashoffset:-1000}}
.flash{opacity:0;animation:flash 4.4s ease-in-out infinite}
@keyframes flash{0%{opacity:0}8%{opacity:1}36%{opacity:0}100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.pulse,.spark,.flash{animation:none;opacity:0}.grow{animation:none}}
</style>
<rect x="6.5" y="6.5" width="867" height="214" rx="12" fill="#151b23" stroke="#262c36"/><path d="M28.5 6.5h28" stroke="#8fb5a2" stroke-width="2" stroke-linecap="round"/>
<text x="38" y="46" class="lbl" >WHAT I BUILD</text><g transform="translate(38 66) scale(0.75)" stroke="#8fb5a2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g><text x="38" y="112" class="s" font-size="15" font-weight="600" fill="#f0f3f6">Desktop &amp; native</text><text x="38" y="136" class="s" font-size="13" fill="#c9d1d9">Cross-platform desktop apps</text><text x="38" y="155" class="s" font-size="13" fill="#c9d1d9">that feel native: Rust cores</text><text x="38" y="174" class="s" font-size="13" fill="#c9d1d9">inside Electron and Tauri</text><text x="38" y="193" class="s" font-size="13" fill="#c9d1d9">shells.</text><g transform="translate(239 66) scale(0.75)" stroke="#8fb5a2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></g><text x="239" y="112" class="s" font-size="15" font-weight="600" fill="#f0f3f6">Web platforms</text><text x="239" y="136" class="s" font-size="13" fill="#c9d1d9">Fast, polished web apps in</text><text x="239" y="155" class="s" font-size="13" fill="#c9d1d9">Next.js and React, from</text><text x="239" y="174" class="s" font-size="13" fill="#c9d1d9">marketing sites to full</text><text x="239" y="193" class="s" font-size="13" fill="#c9d1d9">product dashboards.</text><g transform="translate(440 66) scale(0.75)" stroke="#8fb5a2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="440" y="112" class="s" font-size="15" font-weight="600" fill="#f0f3f6">Business systems</text><text x="440" y="136" class="s" font-size="13" fill="#c9d1d9">ERP platforms with modules,</text><text x="440" y="155" class="s" font-size="13" fill="#c9d1d9">roles and permissions,</text><text x="440" y="174" class="s" font-size="13" fill="#c9d1d9">secure data flows and live</text><text x="440" y="193" class="s" font-size="13" fill="#c9d1d9">dashboards.</text><g transform="translate(641 66) scale(0.75)" stroke="#8fb5a2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M15.707 21.293a1 1 0 0 1-1.414 0l-1.586-1.586a1 1 0 0 1 0-1.414l5.586-5.586a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1 0 1.414z"/><path d="m18 13-1.375-6.874a1 1 0 0 0-.746-.776L3.235 2.028a1 1 0 0 0-1.207 1.207L5.35 15.879a1 1 0 0 0 .776.746L13 18"/><path d="m2.3 2.3 7.286 7.286"/><circle cx="11" cy="11" r="2"/></g><text x="641" y="112" class="s" font-size="15" font-weight="600" fill="#f0f3f6">Interface design</text><text x="641" y="136" class="s" font-size="13" fill="#c9d1d9">Three years of graphic</text><text x="641" y="155" class="s" font-size="13" fill="#c9d1d9">design behind every screen:</text><text x="641" y="174" class="s" font-size="13" fill="#c9d1d9">type, spacing and motion</text><text x="641" y="193" class="s" font-size="13" fill="#c9d1d9">handled with care.</text>
</svg>
