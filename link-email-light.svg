<svg xmlns="http://www.w3.org/2000/svg" width="118" height="44" viewBox="0 0 118 44" fill="none">
<style>
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.lbl{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.08em;fill:#59636e}
.tick{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px;letter-spacing:.06em;fill:#59636e}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.5}80%,100%{transform:scale(3.4);opacity:0}}
.spark{stroke-dasharray:16 984;animation:spark 7s cubic-bezier(.45,0,.55,1) infinite}
@keyframes spark{0%{stroke-dashoffset:16}100%{stroke-dashoffset:-1000}}
.flash{opacity:0;animation:flash 4.4s ease-in-out infinite}
@keyframes flash{0%{opacity:0}8%{opacity:1}36%{opacity:0}100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.pulse,.spark,.flash{animation:none;opacity:0}.grow{animation:none}}
</style>
<rect x="1" y="1" width="116" height="42" rx="8" fill="#f6f8fa" stroke="#e1e5ea"/>
<g transform="translate(16 14) scale(0.6666666666666666)" stroke="#82693f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></g><text x="42" y="27" class="s" font-size="14" font-weight="500" fill="#1f2328">Email</text><g transform="translate(92 16) scale(0.5)" stroke="#59636e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></g>
</svg>
