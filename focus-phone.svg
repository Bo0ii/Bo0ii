<svg xmlns="http://www.w3.org/2000/svg" width="390" height="490" viewBox="0 0 390 490" fill="none">
<style>
:root{--surface:#f6f8fa;--line:#e1e5ea;--faint:#c4ccd5;--muted:#59636e;--text:#424a53;--strong:#1f2328;--accent:#41715c;--blue:#456482;--amber:#82693f}
@media (prefers-color-scheme:dark){:root{--surface:#151b23;--line:#262c36;--faint:#3d444d;--muted:#8b949e;--text:#c9d1d9;--strong:#f0f3f6;--accent:#8fb5a2;--blue:#8ea7c2;--amber:#c4a77e}}
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.lbl{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;font-weight:500;letter-spacing:.08em;fill:var(--muted)}
.tick{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;font-size:10px;letter-spacing:.06em;fill:var(--muted)}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.5}80%,100%{transform:scale(3.4);opacity:0}}
.spark{stroke-dasharray:16 984;animation:spark 7s cubic-bezier(.45,0,.55,1) infinite}
@keyframes spark{0%{stroke-dashoffset:16}100%{stroke-dashoffset:-1000}}
.flash{opacity:0;animation:flash 4.4s ease-in-out infinite}
@keyframes flash{0%{opacity:0}8%{opacity:1}36%{opacity:0}100%{opacity:0}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.pulse,.spark,.flash{animation:none;opacity:0}.grow{animation:none}}
</style>
<rect x="6.5" y="6.5" width="377" height="477" rx="12" style="fill:var(--surface);stroke:var(--line)"/><path d="M28.5 6.5h28" stroke-width="2" stroke-linecap="round" style="stroke:var(--accent)"/>
<text x="24" y="42" class="lbl" >WHAT I BUILD</text><g transform="translate(24 66) scale(0.75)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" style="stroke:var(--accent)"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g><text x="54" y="80" class="s" font-size="15" font-weight="600" style="fill:var(--strong)">Desktop &amp; native</text><text x="54" y="103" class="s" font-size="13" style="fill:var(--text)">Cross-platform desktop apps that feel</text><text x="54" y="122" class="s" font-size="13" style="fill:var(--text)">native: Rust cores inside Electron and</text><text x="54" y="141" class="s" font-size="13" style="fill:var(--text)">Tauri shells.</text><g transform="translate(24 171) scale(0.75)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" style="stroke:var(--accent)"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></g><text x="54" y="185" class="s" font-size="15" font-weight="600" style="fill:var(--strong)">Web platforms</text><text x="54" y="208" class="s" font-size="13" style="fill:var(--text)">Fast, polished web apps in Next.js and</text><text x="54" y="227" class="s" font-size="13" style="fill:var(--text)">React, from marketing sites to full</text><text x="54" y="246" class="s" font-size="13" style="fill:var(--text)">product dashboards.</text><g transform="translate(24 276) scale(0.75)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" style="stroke:var(--accent)"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="54" y="290" class="s" font-size="15" font-weight="600" style="fill:var(--strong)">Business systems</text><text x="54" y="313" class="s" font-size="13" style="fill:var(--text)">ERP platforms with modules, roles and</text><text x="54" y="332" class="s" font-size="13" style="fill:var(--text)">permissions, secure data flows and live</text><text x="54" y="351" class="s" font-size="13" style="fill:var(--text)">dashboards.</text><g transform="translate(24 381) scale(0.75)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" style="stroke:var(--accent)"><path d="M15.707 21.293a1 1 0 0 1-1.414 0l-1.586-1.586a1 1 0 0 1 0-1.414l5.586-5.586a1 1 0 0 1 1.414 0l1.586 1.586a1 1 0 0 1 0 1.414z"/><path d="m18 13-1.375-6.874a1 1 0 0 0-.746-.776L3.235 2.028a1 1 0 0 0-1.207 1.207L5.35 15.879a1 1 0 0 0 .776.746L13 18"/><path d="m2.3 2.3 7.286 7.286"/><circle cx="11" cy="11" r="2"/></g><text x="54" y="395" class="s" font-size="15" font-weight="600" style="fill:var(--strong)">Interface design</text><text x="54" y="418" class="s" font-size="13" style="fill:var(--text)">Three years of graphic design behind every</text><text x="54" y="437" class="s" font-size="13" style="fill:var(--text)">screen: type, spacing and motion handled</text><text x="54" y="456" class="s" font-size="13" style="fill:var(--text)">with care.</text>
</svg>
